<body class="eb-page" id="top">
  <header class="nav nav--dark eb-nav">
    <a class="nav__brand" href="index.html" aria-label="Jade Group — home">
      <img class="nav__logo nav__logo--light" src="img/brand/jade-group-white.png" alt="Jade Group">
      <img class="nav__logo nav__logo--dark" src="img/brand/jade-group-dark.png" alt="">
    </a>
    <nav class="nav__links" aria-label="Main">
      <a href="index.html#legacy">Legacy</a>
      <a href="projects.html">Projects</a>
      <a href="index.html#people">Team</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main class="landmark-map" id="landmark-map">
    <figure class="landmark-map__image">
      <img src="img/ebene-landmarks-night-v4.jpg" alt="Night aerial of Ebène Cybercity showing Raffles Tower, Barclays House and Alexander House" fetchpriority="high">
    </figure>
    <div class="landmark-map__shade" aria-hidden="true"></div>

    <section class="landmark-copy" aria-live="polite">
      <p class="landmark-copy__eyebrow">Three Jade landmarks</p>
      <h1 class="landmark-copy__statement"><span>Building</span><em>quietly, well,</em><span>since 1976</span></h1>
    </section>

    <div class="map-pins" aria-label="Choose a Jade landmark">
      <button class="map-pin" type="button" data-map-select="raffles-tower" style="--pin-x: 43%; --pin-y: 23%;" aria-label="Open the Raffles Tower tour">
        <span class="map-pin__label">Raffles Tower</span><span class="map-pin__line" aria-hidden="true"></span><span class="map-pin__point" aria-hidden="true"></span>
      </button>
      <button class="map-pin" type="button" data-map-select="barclays-house" style="--pin-x: 77%; --pin-y: 29%;" aria-label="Open the Barclays House tour">
        <span class="map-pin__label">Barclays House</span><span class="map-pin__line" aria-hidden="true"></span><span class="map-pin__point" aria-hidden="true"></span>
      </button>
      <button class="map-pin" type="button" data-map-select="alexander-house" style="--pin-x: 67%; --pin-y: 58%;" aria-label="Open the Alexander House tour">
        <span class="map-pin__label">Alexander House</span><span class="map-pin__line" aria-hidden="true"></span><span class="map-pin__point" aria-hidden="true"></span>
      </button>
    </div>

    <p class="landmark-hint"><span class="landmark-hint__mouse" aria-hidden="true"></span> Select a landmark</p>
  </main>

  <section class="building-tour" id="building-tour" role="dialog" aria-label="Immersive building tour" hidden>
    <div class="building-tour__stage" id="tour-stage">
      <img class="building-tour__image" id="tour-image" src="" alt="">
      <div class="building-tour__shade" aria-hidden="true"></div>
    </div>

    <header class="building-tour__heading">
      <p id="tour-eyebrow">Jade landmark 01</p>
      <h2 id="tour-title">Alexander House</h2>
      <p class="building-tour__meta" id="tour-meta">Ebène Cybercity · G+4</p>
      <a id="tour-project" href="project.html?p=alexander-house">View full project <span aria-hidden="true">↗</span></a>
    </header>

    <div class="building-tour__position" aria-live="polite">
      <span id="tour-current">01</span><i></i><span id="tour-total">04</span>
    </div>
    <nav class="building-tour__views" id="tour-views" aria-label="Choose a view of this building"></nav>
    <p class="building-tour__hint">Drag or swipe to move around the building</p>
    <button class="building-tour__close" id="close-tour" type="button" aria-label="Close building tour"><span aria-hidden="true">×</span></button>
  </section>

  <script src="js/ebene.js?v=20260730-1" defer></script>
</body>
</html>
