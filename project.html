<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Jade Group</title>
  <meta name="description" content="A Jade Group development in Mauritius.">

  <!-- Defaults. The script below rewrites title/description/og:* per project,
       which Google honours (it renders JS). Non-rendering scrapers such as
       WhatsApp and Facebook only ever see these defaults, because every
       project shares this one file via ?p=<slug>. Giving each project its own
       social preview needs one static page per project — see README. -->
  <link rel="canonical" href="https://www.jadegroup.mu/projects.html">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Jade Group">
  <meta property="og:locale" content="en_MU">
  <meta property="og:url" content="https://www.jadegroup.mu/projects.html">
  <meta property="og:title" content="Projects — Jade Group">
  <meta property="og:description" content="Office buildings, commercial centres, residences and land developments across Mauritius since 1976.">
  <meta property="og:image" content="https://www.jadegroup.mu/img/og-cover.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Raffles Tower, Barclays House and Alexander House at night in Ebène Cybercity">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Projects — Jade Group">
  <meta name="twitter:description" content="Office buildings, commercial centres, residences and land developments across Mauritius since 1976.">
  <meta name="twitter:image" content="https://www.jadegroup.mu/img/og-cover.jpg">
  <meta name="theme-color" content="#0c0c0b">

  <script>document.documentElement.classList.add("js");</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css?v=20260731-5">
  <link rel="icon" href="img/favicon.svg?v=20260717-2" type="image/svg+xml">
</head>
<body id="top">

  <header class="nav">
    <a class="nav__brand" href="index.html" aria-label="Jade Group — home">
      <img class="nav__logo nav__logo--light" src="img/brand/jade-group-white.png" alt="">
      <img class="nav__logo nav__logo--dark" src="img/brand/jade-group-dark.png" alt="Jade Group">
    </a>
    <nav class="nav__links" aria-label="Main">
      <a href="index.html">Index,</a>
      <a href="projects.html">Projects,</a>
      <a href="index.html#people">Team,</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main class="pdetail">
    <header class="pdetail__head">
      <p class="pdetail__crumb reveal"><a href="projects.html">← All projects</a></p>
      <p class="eyebrow reveal" id="p-cat"></p>
      <h1 class="reveal" id="p-name"></h1>
    </header>

    <section class="pdetail__body">
      <div class="pdetail__meta reveal">
        <dl>
          <div id="p-location-row"><dt>Location</dt><dd id="p-location"></dd></div>
          <div id="p-floors-row"><dt>Scale</dt><dd id="p-floors"></dd></div>
          <div><dt>Sector</dt><dd id="p-sector"></dd></div>
          <div><dt>Enquiries</dt><dd>Charles Li<br><a href="mailto:charles.li@jadegroup.mu">charles.li@jadegroup.mu</a></dd></div>
        </dl>
      </div>
      <div class="pdetail__text">
        <p class="pdetail__lead serif reveal" id="p-lead"></p>
        <p class="pdetail__desc reveal" id="p-body"></p>
        <div class="pdetail__features reveal" id="p-features-wrap">
          <h2>Features</h2>
          <ul id="p-features"></ul>
        </div>
      </div>
    </section>

    <section class="pdetail__gallery" id="p-gallery"></section>

    <nav class="pdetail__next reveal" aria-label="Next project">
      <p class="eyebrow">Next project</p>
      <a id="p-next" href="#"><span class="serif" id="p-next-name"></span> <span aria-hidden="true">→</span></a>
    </nav>
  </main>

  <footer class="footer">
    <img class="footer__logo" src="img/brand/jade-group-white.png" alt="Jade Group">
    <div class="footer__row">
      <p>© 2026 Jade Group. All rights reserved.</p>
      <a href="#top">Back to top ↑</a>
    </div>
  </footer>

  <script src="js/projects-data.js?v=20260727-1"></script>
  <script>
    (function () {
      var slug = new URLSearchParams(window.location.search).get("p");
      var all = window.JADE_PROJECTS;
      var i = all.findIndex(function (p) { return p.slug === slug; });
      if (i === -1) { window.location.replace("projects.html"); return; }
      var p = all[i];

      var pageTitle = p.name + " — Jade Group";
      var pageDesc = p.name + " — " + p.blurb + " A Jade Group development in Mauritius.";
      var pageUrl = "https://www.jadegroup.mu/project.html?p=" + p.slug;
      var pageImg = p.images && p.images.length
        ? "https://www.jadegroup.mu/" + p.images[0]
        : "https://www.jadegroup.mu/img/og-cover.jpg";

      document.title = pageTitle;

      // Keep the social/canonical tags in step with the project being shown.
      var meta = {
        'meta[name="description"]': pageDesc,
        'meta[property="og:title"]': pageTitle,
        'meta[property="og:description"]': pageDesc,
        'meta[property="og:url"]': pageUrl,
        'meta[property="og:image"]': pageImg,
        'meta[property="og:image:alt"]': "Photograph of " + p.name,
        'meta[name="twitter:title"]': pageTitle,
        'meta[name="twitter:description"]': pageDesc,
        'meta[name="twitter:image"]': pageImg
      };
      Object.keys(meta).forEach(function (sel) {
        var el = document.querySelector(sel);
        if (el) el.setAttribute("content", meta[sel]);
      });
      var canonical = document.querySelector('link[rel="canonical"]');
      if (canonical) canonical.setAttribute("href", pageUrl);

      var $ = function (id) { return document.getElementById(id); };
      $("p-cat").textContent = p.category;
      $("p-name").textContent = p.name;
      $("p-sector").textContent = p.category;
      $("p-lead").textContent = p.blurb;

      if (p.location) {
        if (p.mapUrl) {
          var mapLink = document.createElement("a");
          mapLink.href = p.mapUrl;
          mapLink.target = "_blank";
          mapLink.rel = "noopener";
          mapLink.textContent = p.location + " ↗";
          mapLink.setAttribute("aria-label", "Open " + p.name + " in Google Maps");
          $("p-location").appendChild(mapLink);
        } else { $("p-location").textContent = p.location; }
      }
      else { $("p-location-row").remove(); }

      if (p.floors) { $("p-floors").textContent = p.floors; }
      else { $("p-floors-row").remove(); }

      if (p.body && p.body !== p.blurb) { $("p-body").textContent = p.body; }
      else { $("p-body").remove(); }

      if (p.features && p.features.length) {
        var ul = $("p-features");
        p.features.forEach(function (f) {
          var li = document.createElement("li");
          li.textContent = f;
          ul.appendChild(li);
        });
      } else { $("p-features-wrap").remove(); }

      var gallery = $("p-gallery");
      if (p.images && p.images.length) {
        p.images.forEach(function (src) {
          var fig = document.createElement("figure");
          var img = document.createElement("img");
          img.src = src;
          img.alt = (p.category === "Upcoming" ? "Architectural render of " : "Photograph of ") + p.name;
          img.loading = "lazy";
          img.decoding = "async";

          var caption = document.createElement("figcaption");
          caption.className = "photo__label";
          caption.textContent = (p.category === "Upcoming" ? "Architectural render — " : "Photograph — ") + p.name;

          fig.className = "project-photo reveal";
          fig.append(img, caption);
          gallery.appendChild(fig);
        });
        if (p.images.length === 1) gallery.classList.add("pdetail__gallery--single");
      } else {
        [0, 1].forEach(function (n) {
          var fig = document.createElement("figure");
          var label = document.createElement("span");
          fig.className = "placeholder reveal";
          fig.dataset.photo = p.name;
          label.className = "placeholder__label";
          label.textContent = "Photograph — " + p.name + " (" + (n + 1) + ")";
          fig.appendChild(label);
          gallery.appendChild(fig);
        });
      }

      var next = all[(i + 1) % all.length];
      $("p-next").href = "project.html?p=" + next.slug;
      $("p-next-name").textContent = next.name;
    })();
  </script>
  <script src="js/main.js?v=20260730-4"></script>
</body>
</html>
